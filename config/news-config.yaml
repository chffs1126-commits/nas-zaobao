# AI新闻自动化配置文件
# OpenClaw News Template

# 新闻抓取配置
news:
  # 目标日期 (today = 今天, yesterday = 昨天)
  targetDate: today
  
  # 每次抓取的最多条数
  maxItemsPerFeed: 40
  
  # AI新闻分类数量上限
