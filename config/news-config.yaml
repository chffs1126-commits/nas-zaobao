# AI新闻自动化配置
# 支持RSS订阅 + 网页抓取

sources:
  rss:
    - name: 36氪
      url: https://36kr.com/feed
      enabled: true
      priority: high
    - name: 量子位
      url: https://www.qbitai.com/rss
      enabled: true
      priority: high
    - name: IT之家
      url: https://www.ithome.com/rss/
      enabled: true
      priority: medium
      
  web:
    - name: 雷锋网
      url: https://www.leiphone.com
      enabled: true
      keywords: [AI, 大模型, 芯片, 自动驾驶, 开源, 机器人]
    - name: 极客公园
      url: https://www.geekpark.net
      enabled: true
      keywords: [AI, 大模型, 芯片, 自动驾驶, 开源]

# 新闻处理流程
processing:
  # 去重配置
  deduplication:
    enabled: true
    engine: similarity  # similarity: 相似度去重
    threshold: 0.85    # 相似度阈值
    window: 86400      # 24小时窗口期
    
  # 内容清洗
  cleaning:
    enabled: true
    removeAds: true
    removeNav: true
    removeFooter: true
    minLength: 50      # 最小内容长度
    
  # 摘要生成
  summarization:
    enabled: false     # 需要配置LLM
    model: local-llm
    maxLength: 150
    format: bullet     # bullet: 列表格式
    
  # 新闻分类
  classification:
    enabled: true
    categories:
      - AI              # 大模型、ChatGPT、AI应用
      - 硬件            # 芯片、GPU、服务器
      - 开发            # 编程、开源、工具
      - 产业            # 公司、融资、市场
      - 创业            # 创业公司、創投
    defaultCategory: 产业
    
  # 新闻打分
  scoring:
    enabled: true
    weights:
      prioritySource: 5   # 来源权重
      timeliness: 3       # 时效性
      engagement: 2       # 热度
    prioritySources: [36氪, 量子位, 机器之心, 雷锋网]

# 定时任务
schedule:
  enabled: true
  interval: 3600        # 每小时运行一次（秒）
  jitter: 300           # 随机延迟0-5分钟
  timezone: Asia/Shanghai
  
# 飞书推送
feishu:
  enabled: true
  docId: ""             # 留空则自动创建新文档
  indexDocId: "W6c9dEL0qoIK7Qx9r20cP96Inbg"
  
# 输出配置
output:
  jsonDir: ./news
  reportDir: ./news
  keepDays: 7            # 保留最近7天数据
